name: PowVPN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powvpn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Source integrity check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate repository contents
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f README.md
          test -d client
          git diff --check HEAD~1 HEAD || true

      - name: Report build policy
        shell: bash
        run: |
          echo "Source checks passed. Release builds are performed in the controlled PowVPN build environment."